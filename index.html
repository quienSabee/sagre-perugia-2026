<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sagre Perugia</title>
  <meta name="description" content="Sagre, feste popolari ed eventi paesani a Perugia e dintorni." />
  <link rel="icon" href="assets/grifo.svg" type="image/svg+xml" />
  <link rel="preload" as="image" href="assets/parallax_bg-1024.webp" type="image/webp" imagesrcset="assets/parallax_bg-480.webp 480w, assets/parallax_bg-768.webp 768w, assets/parallax_bg-1024.webp 1024w, assets/parallax_bg-1366.webp 1366w, assets/parallax_bg-1672.webp 1672w" imagesizes="100vw" />
  <link rel="preload" as="image" href="assets/parallax_stalls-1024.webp" type="image/webp" imagesrcset="assets/parallax_stalls-480.webp 480w, assets/parallax_stalls-768.webp 768w, assets/parallax_stalls-1024.webp 1024w, assets/parallax_stalls-1366.webp 1366w, assets/parallax_stalls-1672.webp 1672w" imagesizes="100vw" />
  <link rel="preload" as="image" href="assets/background-sagra-perugia-1024.webp" type="image/webp" media="(min-width: 921px)" />
  <link rel="stylesheet" href="styles.css?v=20260610-image-reveal" />
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#top" aria-label="Sagre Perugia">
      <img class="brand-mark" src="assets/grifo.svg" alt="" width="38" height="38" />
      <span>Sagre Perugia</span>
    </a>

    <button
      class="mobile-menu-toggle"
      type="button"
      aria-label="Apri filtri"
      aria-expanded="false"
      aria-controls="topbar-panel"
    >
      <span></span>
      <span></span>
      <span></span>
    </button>

    <div class="topbar-panel" id="topbar-panel">
      <form class="search-form" role="search">
        <label class="sr-only" for="search">Cerca sagre</label>
        <input id="search" name="search" type="search" autocomplete="off" placeholder="Cerca sagre, località, date" />
      </form>

      <div class="status-filters" aria-label="Filtra eventi per stato">
        <button class="filter-button filter-past" type="button" data-status="past" aria-pressed="false">
          <span id="past-count">0 passati</span>
        </button>
        <button class="filter-button filter-active" type="button" data-status="active" aria-pressed="true">
          <span id="active-count">0 in corso</span>
        </button>
        <button class="filter-button filter-future" type="button" data-status="future" aria-pressed="true">
          <span id="future-count">0 futuri</span>
        </button>
      </div>
    </div>
  </header>

  <main id="top">
    <section class="hero" id="hero">
      <div class="hero-parallax" aria-hidden="true">
        <picture class="parallax-layer parallax-picture parallax-bg" style="--placeholder: url('assets/parallax_bg-placeholder.png')">
          <source type="image/webp" srcset="assets/parallax_bg-480.webp 480w, assets/parallax_bg-768.webp 768w, assets/parallax_bg-1024.webp 1024w, assets/parallax_bg-1366.webp 1366w, assets/parallax_bg-1672.webp 1672w" sizes="100vw" />
          <img src="assets/parallax_bg.png" alt="" width="1672" height="941" loading="eager" decoding="async" fetchpriority="high" />
        </picture>
        <picture class="parallax-layer parallax-picture parallax-stalls" style="--placeholder: url('assets/parallax_stalls-placeholder.png')">
          <source type="image/webp" srcset="assets/parallax_stalls-480.webp 480w, assets/parallax_stalls-768.webp 768w, assets/parallax_stalls-1024.webp 1024w, assets/parallax_stalls-1366.webp 1366w, assets/parallax_stalls-1672.webp 1672w" sizes="100vw" />
          <img src="assets/parallax_stalls.png" alt="" width="1672" height="941" loading="eager" decoding="async" fetchpriority="high" />
        </picture>
        <picture class="parallax-layer parallax-picture parallax-grifo" style="--placeholder: url('assets/parallax_grifo-placeholder.png')">
          <source type="image/webp" srcset="assets/parallax_grifo-480.webp 480w, assets/parallax_grifo-768.webp 768w, assets/parallax_grifo-1024.webp 1024w, assets/parallax_grifo-1366.webp 1366w, assets/parallax_grifo-1672.webp 1672w" sizes="100vw" />
          <img src="assets/parallax_grifo.png" alt="" width="1672" height="941" loading="eager" decoding="async" fetchpriority="auto" />
        </picture>
        <picture class="parallax-layer parallax-picture parallax-table" style="--placeholder: url('assets/parallax_table-placeholder.png')">
          <source type="image/webp" srcset="assets/parallax_table-480.webp 480w, assets/parallax_table-768.webp 768w, assets/parallax_table-1024.webp 1024w, assets/parallax_table-1366.webp 1366w, assets/parallax_table-1672.webp 1672w" sizes="100vw" />
          <img src="assets/parallax_table.png" alt="" width="1672" height="941" loading="eager" decoding="async" fetchpriority="auto" />
        </picture>
      </div>
      <div class="hero-shade" aria-hidden="true"></div>
      <div class="hero-content">
        <p class="eyebrow">Perugia e dintorni</p>
        <h1>Sagre, feste ed eventi popolari</h1>
        <p class="hero-copy">Forza grifo, dio schifo!</p>
      </div>
    </section>

    <section class="content" aria-live="polite">
      <div class="cards-grid" id="events"></div>
      <p class="empty-state" id="empty-state" hidden>Nessun evento trovato.</p>
    </section>
  </main>

  <script src="app.js?v=20260610-image-reveal" defer></script>
</body>
</html>
