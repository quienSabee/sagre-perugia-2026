<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sagre Perugia 2026</title>
    <meta
      name="description"
      content="Sagre, feste popolari ed eventi paesani a Perugia e dintorni nel 2026."
    />
    <link rel="preload" href="assets/sagra-perugia.png" as="image" />
    <link rel="preload" href="assets/background-sagra-perugia.png" as="image" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="topbar">
      <a class="brand" href="#top" aria-label="Sagre Perugia 2026">
        <span class="brand-mark">PG</span>
        <span>Sagre Perugia 2026</span>
      </a>

      <form class="search-form" role="search">
        <label class="sr-only" for="search">Cerca sagre</label>
        <input
          id="search"
          name="search"
          type="search"
          autocomplete="off"
          placeholder="Cerca sagre, località, date"
        />
      </form>

      <div class="status-filters" aria-label="Filtra eventi per stato">
        <button class="filter-button filter-past" type="button" data-status="past" aria-pressed="false">
          <span id="past-count">0 passati</span>
        </button>
        <button class="filter-button filter-active" type="button" data-status="active" aria-pressed="true">
          <span id="active-count">0 in corso</span>
        </button>
        <button class="filter-button filter-future" type="button" data-status="future" aria-pressed="true">
          <span id="future-count">0 futuri</span>
        </button>
      </div>
    </header>

    <main id="top">
      <section class="hero" aria-labelledby="page-title">
        <div class="hero-content">
          <p class="eyebrow">Perugia e dintorni</p>
          <h1 id="page-title">Sagre, feste ed eventi popolari 2026</h1>
          <p class="hero-copy">Forza grifo, dio schifo!</p>
        </div>
      </section>

      <section class="content" aria-live="polite">
        <div class="cards-grid" id="events"></div>

        <p class="empty-state" id="empty-state" hidden>
          Nessun evento trovato.
        </p>
      </section>
    </main>

    <script src="app.js" defer></script>
  </body>
</html>
